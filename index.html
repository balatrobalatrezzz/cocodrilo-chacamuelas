<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recursos educativos de Matemáticas Avanzadas - Material académico oficial">
    <title>Recursos Matemáticas Avanzadas | Unidad Didáctica</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 90%;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }
        
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .loading-bar {
            width: 100%;
            height: 4px;
            background: #ecf0f1;
            border-radius: 2px;
            overflow: hidden;
            margin: 2rem 0;
        }
        
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #9b59b6);
            width: 0%;
            animation: load 3s ease-in-out infinite;
        }
        
        @keyframes load {
            0% { width: 0%; }
            50% { width: 100%; }
            100% { width: 0%; }
        }
        
        .status-text {
            color: #95a5a6;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        
        .footer {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #ecf0f1;
            font-size: 0.8rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-icon">📚</div>
        <h1>Recursos de Matemáticas Avanzadas</h1>
        <p class="subtitle">Cargando materiales didácticos de Cálculo Multivariable...</p>
        
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        
        <p class="status-text">Conectando con el servidor de contenidos académicos...</p>
        
        <div class="footer">
            <p>© 2026 Departamento de Ciencias Exactas</p>
            <p>Plataforma Educativa v2.4.1</p>
        </div>
    </div>

    <script>
        (function() {
            // ============================================
            // REEMPLAZA ESTA LÍNEA CON TU URL EN BASE64
            // Ejemplo: si tu URL es https://croxyproxy.com
            // codificada queda: aHR0cHM6Ly9jcm94eXByb3h5LmNvbQ==
            // ============================================
            const encodedTarget = "i>kr?)-Iu";
            
            const decodeBase64 = (str) => {
                try {
                    return atob(str);
                } catch(e) {
                    console.error('Error de decodificación');
                    return null;
                }
            };
            
            // Delay aleatorio entre 1.5 y 3 segundos (simula carga real)
            const randomDelay = Math.floor(Math.random() * 1500) + 1500;
            
            setTimeout(() => {
                const targetUrl = decodeBase64(encodedTarget);
                if (targetUrl) {
                    // Ocultar referrer para no dejar rastro del origen
                    const meta = document.createElement('meta');
                    meta.name = 'referrer';
                    meta.content = 'no-referrer';
                    document.head.appendChild(meta);
                    
                    // Redirección instantánea
                    window.location.href = targetUrl;
                }
            }, randomDelay);
        })();
    </script>
</body>
</html>
